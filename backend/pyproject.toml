[project]
name = "aegis"
version = "0.6.0"
description = "AegisAI: an architectural firewall for AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "google-genai>=0.3",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The FastAPI instance lives at aegis/main.py, not one of Vercel's default
# entrypoint filenames (app.py, main.py at the root, etc.), so it has to be
# pointed at explicitly for the Python runtime to find it.
[tool.vercel]
entrypoint = "aegis.main:app"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's Depends() in a default argument is the framework's
# documented dependency injection pattern, not the mutable-default footgun
# this rule exists for.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
